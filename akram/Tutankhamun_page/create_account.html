<form id="registerForm" class="auth-form">
  <h2>Create Account</h2>
  
  <div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" id="regName" class="form-control" required />
  </div>

  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" id="regEmail" class="form-control" required />
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" id="regPassword" class="form-control" required />
  </div>

  <div id="regAlert" class="alert d-none" role="alert"></div>

  <button type="submit" class="btn btn-gold w-100">Register</button>
  
  <p class="text-center text-light mt-3 mb-0 small">
    Already have an account? <a href="signin.html" class="text-warning text-decoration-none fw-bold">Sign In</a>
  </p>
</form>
