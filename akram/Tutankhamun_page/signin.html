<form id="loginForm" class="auth-form">
  <h2>Sign In</h2>
  
  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" id="loginEmail" class="form-control" required />
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" id="loginPassword" class="form-control" required />
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3 fs-6">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="rememberMe">
      <label class="form-check-label text-light" for="rememberMe">
        Remember Me
      </label>
    </div>
    <a href="#" class="text-warning text-decoration-none small">Forgot Password?</a>
  </div>

  <div id="loginAlert" class="alert d-none" role="alert"></div>

  <button type="submit" class="btn btn-gold w-100">Sign In</button>

  <p class="text-center text-light mt-3 mb-0 small">
    Don't have an account? <a href="create_account.html" class="text-warning text-decoration-none fw-bold">Create Account</a>
  </p>
</form>
